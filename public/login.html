<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in · Aperture</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #161616;
        --muted: #77756f;
        --paper: #f4f3ef;
        --card: #fffefa;
        --accent: #e7ff55;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: var(--ink);
        background: var(--paper);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      main {
        width: min(100%, 440px);
        padding: 42px;
        background: var(--card);
        border: 1px solid #deddd8;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 2.5rem;
        letter-spacing: -0.07em;
      }
      p {
        color: var(--muted);
      }
      label {
        display: block;
        margin: 28px 0 8px;
        font-size: 0.8rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      input {
        width: 100%;
        padding: 13px;
        border: 1px solid var(--ink);
        background: white;
        font: inherit;
      }
      button {
        width: 100%;
        margin-top: 14px;
        padding: 13px;
        border: 1px solid var(--ink);
        background: var(--ink);
        color: white;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:focus-visible,
      input:focus-visible {
        outline: 3px solid #687600;
        outline-offset: 3px;
      }
      #status {
        min-height: 1.5em;
        margin-top: 18px;
      }
      .fine-print {
        font-size: 0.82rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Aperture</h1>
      <p>Private intelligence, distilled.</p>
      <form id="login-form">
        <label for="email">Email address</label>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          required
        />
        <button type="submit">Email me a sign-in link</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
      <p class="fine-print">
        The link expires in 15 minutes and can only be used once.
      </p>
    </main>
    <script>
      const form = document.querySelector("#login-form");
      const status = document.querySelector("#status");
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        status.textContent = "Sending…";
        const response = await fetch("/api/auth/magic-link", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ email: new FormData(form).get("email") }),
        });
        status.textContent = response.ok
          ? "If that address is valid, a sign-in link is on its way."
          : "We could not send a sign-in link. Please try again.";
      });
    </script>
  </body>
</html>
